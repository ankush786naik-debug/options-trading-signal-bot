name: EMA 9-15 Reversal Backtest

on:
  workflow_dispatch:
    inputs:
      cost_points:
        description: "Round-trip cost estimate in underlying index points (proxy)"
        required: true
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pure EMA 9/15 reversal backtest
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          COST_POINTS: ${{ inputs.cost_points }}
        run: python ema_9_15_reversal_backtest.py --cost-points "$COST_POINTS"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ema-9-15-reversal-backtest
          path: ema_9_15_backtest_results/
          if-no-files-found: error
