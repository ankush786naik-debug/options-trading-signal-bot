name: VWAP Strategy Backtest

on:
  workflow_dispatch:
    inputs:
      cost_points:
        description: "Round-trip cost proxy in underlying index points"
        required: true
        type: string
        default: "0"
      adx_threshold:
        description: "Minimum ADX(14) for VWAP + ADX variant"
        required: true
        type: string
        default: "20"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run VWAP-only and VWAP + ADX futures backtests (6 months)
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          COST_POINTS: ${{ inputs.cost_points }}
          ADX_THRESHOLD: ${{ inputs.adx_threshold }}
        run: python vwap_strategy_backtest.py --cost-points "$COST_POINTS" --adx-threshold "$ADX_THRESHOLD"
      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        with:
          name: vwap-futures-vwap-adx-6-months
          path: vwap_backtest_results/
          if-no-files-found: error
