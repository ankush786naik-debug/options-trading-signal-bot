name: Options Signal Bot

on:
  workflow_dispatch:
    inputs:
      send_telegram_test:
        description: "Send a Telegram connectivity test message"
        required: true
        type: boolean
        default: true

  schedule:
    # Offset by one minute to avoid busy scheduler boundaries.
    # 09:21–14:41 IST, every 5 minutes on weekdays.
    - cron: "51,56 3 * * 1-5"
    - cron: "1-56/5 4-8 * * 1-5"
    - cron: "1,6,11 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: options-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore trade state
        uses: actions/cache/restore@v4
        with:
          path: trade_state.json
          key: trade-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trade-state-

      - name: Initialize trade state
        run: |
          if [ ! -f trade_state.json ]; then
            echo '{"signals": []}' > trade_state.json
          fi

      - name: Send Telegram connectivity test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_telegram_test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTS_ENABLED: "true"
        run: python telegram_test.py

      - name: Run one scanner cycle
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTS_ENABLED: "true"
          RUN_ONCE: "true"
          LOG_LEVEL: INFO
        run: python main.py

      - name: Save trade state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: trade_state.json
          key: trade-state-${{ github.run_id }}-${{ github.run_attempt }}
