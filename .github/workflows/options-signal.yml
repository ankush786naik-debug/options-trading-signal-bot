name: Options Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 3-10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: options-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore trade state
        uses: actions/cache@v4
        with:
          path: trade_state.json
          key: trade-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trade-state-

      - name: Initialize trade state
        run: |
          if [ ! -f trade_state.json ]; then
            echo '{"signals": []}' > trade_state.json
          fi

      - name: Run scanner
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTS_ENABLED: "false"
          LOG_LEVEL: INFO
        run: python main.py
