name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r daily_stock_scanner/requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests
      - run: python -m unittest discover -s daily_stock_scanner -p 'test_*.py'
